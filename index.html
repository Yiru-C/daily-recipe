<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d66b3d" />
  <title>食堂日常</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root {
      --bg: #f6efe5;
      --card: #fffaf4;
      --text: #2f2a25;
      --muted: #796f66;
      --primary: #d66b3d;
      --primary-dark: #b9552e;
      --accent: #748b59;
      --line: #eadfd2;
      --danger: #b84444;
      --shadow: 0 8px 24px rgba(75, 52, 35, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; display: block; }

    .app {
      max-width: 980px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 16px 92px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .brand h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .primary-btn, .secondary-btn, .ghost-btn, .danger-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }
    .primary-btn { background: var(--primary); color: white; }
    .primary-btn:hover { background: var(--primary-dark); }
    .secondary-btn { background: #e7eedf; color: #3e5130; }
    .ghost-btn { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .danger-btn { background: #f7e4e4; color: var(--danger); }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: rgba(255,255,255,.55);
      padding: 6px;
      border-radius: 16px;
      position: sticky;
      top: 8px;
      z-index: 10;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .tab-btn {
      border: 0;
      background: transparent;
      border-radius: 12px;
      padding: 11px 8px;
      color: var(--muted);
      font-weight: 700;
    }
    .tab-btn.active { background: var(--card); color: var(--primary); }
    .page { display: none; }
    .page.active { display: block; }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .panel h2, .panel h3 { margin-top: 0; }

    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .subsection-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 18px 0 10px;
    }
    .subsection-title h3 { margin: 0; }
    .recipe-form-block {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: rgba(255,255,255,.7);
    }
    .recipe-form-block + .recipe-form-block { margin-top: 14px; }
    .recipe-form-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .recipe-form-block-header strong { font-size: 15px; }
    .servings-row {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 10px;
      align-items: end;
    }
    .planner-item {
      display: grid;
      grid-template-columns: 1fr 72px auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .planner-item-name {
      font-weight: 700;
      cursor: pointer;
      color: var(--primary-dark);
    }
    .planner-item-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }
    .planner-item input[type="number"] {
      width: 72px;
      text-align: center;
    }

    .planner-serving-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-end;
      white-space: nowrap;
    }

    .planner-serving-unit {
      color: var(--muted);
      font-size: 13px;
    }

    .meal-header-left {
      display: grid;
      gap: 10px;
    }

    .meal-share-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meal-share-control .stepper {
      gap: 6px;
    }

    .meal-share-control .input {
      width: 72px;
      text-align: center;
      padding: 8px 6px;
    }
    .detail-serving-row {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
      align-items: end;
      margin-top: 14px;
    }
    .detail-list {
      display: grid;
      gap: 8px;
    }
    .detail-line {
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      line-height: 1.5;
    }
    .detail-line.muted {
      color: var(--muted);
      background: rgba(255,255,255,.65);
    }
    .meal-picker-hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }
    .input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      outline: none;
    }
    textarea { resize: vertical; min-height: 110px; }
    .input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(214,107,61,.12); }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }
    .recipe-card {
      overflow: hidden;
      border-radius: 16px;
      background: white;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .recipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .recipe-card img { width: 100%; height: 150px; object-fit: cover; background: #efe7de; }
    .recipe-card-body { padding: 12px; }
    .recipe-card h3 { margin: 0 0 8px; font-size: 18px; }
    .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .chip {
      padding: 6px 9px;
      border-radius: 999px;
      background: #f0e9df;
      color: #5f554c;
      border: 1px solid transparent;
      font-size: 13px;
    }
    .chip.selectable { cursor: pointer; }
    .chip.selected { background: #dfead5; color: #3d542d; border-color: #aabd94; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 36px 20px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.35);
    }

    .date-nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .date-nav input { text-align: center; font-weight: 700; }

    .meal-section { margin-top: 16px; }
    .meal-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .meal-header h3 { margin: 0; }
    .meal-list { display: grid; gap: 9px; margin-top: 10px; }
    .meal-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .meal-item-name { font-weight: 700; cursor: pointer; color: var(--primary-dark); }

    .shopping-list { display: grid; gap: 8px; }
    .shopping-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 10px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .shopping-item.checked { opacity: .55; text-decoration: line-through; }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(35, 28, 22, .58);
      z-index: 100;
      padding: 18px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: block; }
    .modal {
      max-width: 720px;
      margin: 24px auto;
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
      overflow: hidden;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 2;
    }
    .modal-header h2 { margin: 0; }
    .modal-body { padding: 18px; }
    .close-btn { border: 0; background: transparent; font-size: 26px; line-height: 1; color: var(--muted); }

    .form-grid { display: grid; gap: 14px; }
    .form-grid.two { grid-template-columns: 1fr 1fr; }
    label { display: grid; gap: 7px; font-weight: 700; }
    .help { color: var(--muted); font-size: 12px; font-weight: 400; }
    .ingredient-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .image-preview {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--line);
      display: none;
      margin-top: 8px;
    }
    .modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; margin-top: 18px; }

    .detail-image { width: 100%; max-height: 330px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; }
    .detail-section { margin-top: 20px; }
    .detail-section h3 { margin-bottom: 8px; }
    .detail-section ol, .detail-section ul { padding-left: 22px; line-height: 1.8; }
    .steps { white-space: pre-wrap; line-height: 1.8; }

    @media (max-width: 640px) {
      .app { padding: 14px 12px 80px; }
      .topbar { align-items: flex-start; }
      .brand h1 { font-size: 26px; }
      .form-grid.two { grid-template-columns: 1fr; }
      .ingredient-row { grid-template-columns: 1fr 1fr auto; }
      .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .recipe-card img { height: 120px; }
      .search-row { grid-template-columns: 1fr; }
    }
  </style>
<style>

    .modal-backdrop.nested { z-index: 110; }
    .nutrition-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
    .nutrition-card { background: white; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
    .nutrition-card .label { font-size: 12px; color: var(--muted); }
    .nutrition-card .value { font-size: 18px; font-weight: 800; margin-top: 6px; }
    .nutrition-note { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .step-editor { display: grid; gap: 10px; }
    .step-row { display: grid; grid-template-columns: 38px 1fr auto; gap: 8px; align-items: start; }
    .step-index { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #f0e9df; color: #5f554c; font-weight: 800; }
    .step-row textarea { min-height: 80px; }
    .stepper { display: inline-flex; align-items: center; gap: 8px; }
    .stepper button { width: 40px; height: 40px; padding: 0; border-radius: 12px; }
    .stepper input { width: 84px; text-align: center; }
    .stepper-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .meal-serving-name { font-weight: 800; font-size: 18px; }
    .meal-serving-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .nutrition-block { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: rgba(255,255,255,.72); }
    .nutrition-block + .nutrition-block { margin-top: 14px; }
    .nutrition-block-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .nutrition-block-header strong { font-size: 15px; }
    .detail-serving-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; margin-top: 14px; }
    .detail-summary-grid { display: grid; gap: 8px; }
    .detail-summary-item { padding: 9px 10px; border: 1px solid var(--line); background: white; border-radius: 12px; line-height: 1.5; }

</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>食堂日常</h1>
        <p>记录喜欢的菜，安排每一天的饭。</p>
      </div>
      <button class="primary-btn" id="openRecipeFormBtn">＋ 添加菜谱</button>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-page="recipes">菜单</button>
      <button class="tab-btn" data-page="pantry">食材寻菜</button>
      <button class="tab-btn" data-page="planner">每日规划</button>
    </nav>

    <section class="page active" id="page-recipes">
      <div class="panel">
        <h2>搜索菜谱</h2>
        <div class="filter-grid">
          <select id="categoryFilter" class="input">
            <option value="">全部分类</option>
          </select>
          <select id="tagFilter" class="input">
            <option value="">全部标签</option>
          </select>
        </div>
        <div class="search-row" style="margin-top:12px;">
          <input id="recipeSearch" class="input" placeholder="输入菜名、食材、分类或标签" />
          <button class="ghost-btn" id="clearSearchBtn">清空</button>
        </div>
      </div>
      <div id="recipeGrid" class="recipe-grid"></div>
    </section>
    <section class="page" id="page-pantry">
      <div class="panel">
        <h2>食材寻菜</h2>
        <p class="meta">选择家里现有的食材，快速筛出可做菜谱</p>
        <div class="search-row" style="margin-top:12px;">
          <input id="customPantryInput" class="input" placeholder="添加一种食材，例如：番茄" />
          <button class="secondary-btn" id="addPantryIngredientBtn">添加食材</button>
        </div>
        <div id="pantryChips" class="chips" style="margin-top:14px;"></div>
      </div>
      <div class="panel">
        <h2>可以做什么？</h2>
        <div id="pantryMatches" class="recipe-grid"></div>
      </div>
    </section>

    <section class="page" id="page-planner">
      <div class="panel">
        <div class="date-nav">
          <button class="ghost-btn" id="prevDayBtn">←</button>
          <input id="planDate" class="input" type="date" />
          <button class="ghost-btn" id="nextDayBtn">→</button>
        </div>
        <button class="secondary-btn" id="todayBtn" style="width:100%;margin-top:10px;">回到今天</button>
      </div>

      <div class="panel">
        <h2>当日营养（人均）</h2>
        <p class="meta">每一餐都可以单独输入共享人数，下面只显示该餐的人均营养。</p>
        <div id="dailyNutritionSummary"></div>
      </div>

      <div id="mealSections"></div>

      <div class="panel">
        <h2>当天所需食材</h2>
        <p class="meta">勾选已准备好的食材。相同食材会自动合并显示。</p>
        <div id="dailyIngredients" class="shopping-list"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="recipeFormModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="recipeFormTitle">添加菜谱</h2>
        <button class="close-btn" data-close="recipeFormModal">×</button>
      </div>
      <div class="modal-body">
        <form id="recipeForm">
          <input type="hidden" id="recipeId" />
          <div class="form-grid">
            <label>菜名
              <input id="recipeName" class="input" required placeholder="例如：番茄炒蛋" />
            </label>
            <div class="form-grid two">
              <label>分类
                <input id="recipeCategory" class="input" placeholder="例如：家常菜、汤、烘焙" />
              </label>
              <label>标签
                <input id="recipeTags" class="input" placeholder="用逗号分隔，例如：快手, 下饭" />
              </label>
            </div>

            <div class="nutrition-block">
              <div class="nutrition-block-header"><strong>营养信息（可选，按默认份数）</strong></div>
              <div class="form-grid two">
                <label>热量（kcal）
                  <input id="recipeCalories" class="input" type="number" min="0" step="0.1" placeholder="例如：220" />
                </label>
                <label>碳水（g）
                  <input id="recipeCarbs" class="input" type="number" min="0" step="0.1" placeholder="例如：12" />
                </label>
                <label>蛋白质（g）
                  <input id="recipeProtein" class="input" type="number" min="0" step="0.1" placeholder="例如：13" />
                </label>
                <label>脂肪（g）
                  <input id="recipeFat" class="input" type="number" min="0" step="0.1" placeholder="例如：14" />
                </label>
              </div>
              <div class="nutrition-note">如果以后接入 AI，可在这里自动补全；当前版本先支持手动录入。</div>
            </div>

            <label>菜谱图片
              <input id="recipeImage" class="input" type="file" accept="image/*" />
              <span class="help">图片会压缩后保存在当前浏览器中。</span>
              <img id="imagePreview" class="image-preview" alt="图片预览" />
            </label>

            <div class="recipe-form-block">
              <div class="recipe-form-block-header">
                <strong>食材</strong>
                <button type="button" class="secondary-btn" id="addIngredientRowBtn">＋ 食材</button>
              </div>
              <div id="ingredientRows"></div>
            </div>

            <div class="recipe-form-block">
              <div class="recipe-form-block-header">
                <strong>调料</strong>
                <button type="button" class="secondary-btn" id="addSeasoningRowBtn">＋ 调料</button>
              </div>
              <div id="seasoningRows"></div>
            </div>

            <div class="nutrition-block">
              <div class="nutrition-block-header">
                <strong>制作过程</strong>
                <button type="button" class="secondary-btn" id="addStepBtn">＋ 添加步骤</button>
              </div>
              <div id="stepRows" class="step-editor"></div>
              <div class="nutrition-note">每次点击会自动添加下一步并编号，不需要手动输入序号。</div>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="danger-btn" id="deleteRecipeBtn" style="display:none;">删除菜谱</button>
            <button type="button" class="ghost-btn" data-close="recipeFormModal">取消</button>
            <button type="submit" class="primary-btn">保存菜谱</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" id="recipeDetailModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="detailTitle">菜谱详情</h2>
        <button class="close-btn" data-close="recipeDetailModal">×</button>
      </div>
      <div class="modal-body" id="recipeDetailBody"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="mealPickerModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="mealPickerTitle">选择菜谱</h2>
        <button class="close-btn" data-close="mealPickerModal">×</button>
      </div>
      <div class="modal-body">
        <input id="mealPickerSearch" class="input" placeholder="搜索菜名、食材、分类或标签" />
        <div class="meal-picker-hint">点击菜谱后会在内置面板里选择这道菜要做几份的用量。</div>
        <div id="mealPickerGrid" class="recipe-grid" style="margin-top:14px;"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop nested" id="mealServingModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="mealServingTitle">选择份数</h2>
        <button class="close-btn" data-close="mealServingModal">×</button>
      </div>
      <div class="modal-body">
        <div id="mealServingRecipeName" class="meal-serving-name"></div>
        <p class="meta" id="mealServingHint" style="margin-top:8px;"></p>
        <div class="stepper-wrap" style="margin-top:14px;">
          <div class="stepper">
            <button type="button" class="ghost-btn" id="mealServingMinus">－</button>
            <input id="mealServingInput" class="input" type="number" min="1" step="1" value="1" />
            <button type="button" class="ghost-btn" id="mealServingPlus">＋</button>
          </div>
        </div>
        <div class="meal-serving-actions">
          <button type="button" class="ghost-btn" data-close="mealServingModal">取消</button>
          <button type="button" class="primary-btn" id="confirmMealServingBtn">确认添加</button>
        </div>
      </div>
    </div>
  </div>
  
<script>
(() => {
  const STORAGE_KEYS = {
    appState: 'shitangDaily.appState.v3',
    recipes: 'shitangDaily.recipes.v3',
    pantry: 'shitangDaily.pantry.v3',

  function clone(value) {
    return typeof structuredClone === 'function' ? structuredClone(value) : JSON.parse(JSON.stringify(value));

  function loadJson(key, fallback) {

  function normalize(text) {
    return String(text || '').trim().toLowerCase();
  }

  function escapeHtml(text) {
    return String(text || '').replace(/[&<>'"]/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[char]);
  }

  function getToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function addDays(dateStr, amount) {
    const date = new Date(`${dateStr}T12:00:00`);
    date.setDate(date.getDate() + amount);
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatNumber(num) {
    const rounded = Math.round((Number(num) + Number.EPSILON) * 100) / 100;
    return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
  }

  function parseAmountInput(raw) {
    const text = String(raw || '').trim();
    if (!text) return null;
    const numericMatch = text.match(/^([0-9]+(?:\.[0-9]+)?)\s*(.+)$/);
    if (numericMatch) {
      return { kind: 'numeric', quantity: Number(numericMatch[1]), unit: numericMatch[2].trim() };
    }
    if (/^[0-9]+(?:\.[0-9]+)?$/.test(text)) {
      return { kind: 'invalid-number-only' };
    }
    return { kind: 'text', text };
  }

  function normalizeAmount(amount) {
    if (!amount) return null;
    if (typeof amount === 'string') {
      const parsed = parseAmountInput(amount);
      if (!parsed || parsed.kind === 'invalid-number-only') return null;
      return parsed.kind === 'numeric'
        ? { kind: 'numeric', quantity: parsed.quantity, unit: parsed.unit }
        : { kind: 'text', text: parsed.text };
    }
    if (amount.kind === 'numeric') {
      const quantity = Number(amount.quantity);
      if (!Number.isFinite(quantity)) return null;
      return { kind: 'numeric', quantity, unit: String(amount.unit || '').trim() };
    }
    if (amount.kind === 'text') {
      return { kind: 'text', text: String(amount.text || '').trim() };
    }
    return null;
  }

  function formatAmount(amount, scale = 1) {
    const normalized = normalizeAmount(amount);
    if (!normalized) return '';
    if (normalized.kind === 'text') return normalized.text;
    const quantity = normalized.quantity * scale;
    return `${formatNumber(quantity)}${normalized.unit || ''}`;
  }

  function normalizeSteps(steps) {
    if (Array.isArray(steps)) {
      return steps.map(step => String(step || '').trim()).filter(Boolean);
    }
    return String(steps || '')
      .split(/\n+/)
      .map(line => line.replace(/^\s*\d+[.、\s]*/, '').trim())
      .filter(Boolean);
  }

  function serializeSteps(steps) {
    return normalizeSteps(steps).map((step, index) => `${index + 1}. ${step}`).join('\n');
  }

  function normalizeNutrition(nutrition = {}) {
    const fields = ['calories', 'carbs', 'protein', 'fat'];
    const output = {};
    fields.forEach(field => {
      const raw = nutrition[field];
      const num = raw === '' || raw === null || raw === undefined ? null : Number(raw);
      output[field] = Number.isFinite(num) ? num : null;
    });
    return output;
  }

  function scaleNutrition(nutrition, scale) {
    const n = normalizeNutrition(nutrition || {});
    return {
      calories: n.calories === null ? null : n.calories * scale,
      carbs: n.carbs === null ? null : n.carbs * scale,
      protein: n.protein === null ? null : n.protein * scale,
      fat: n.fat === null ? null : n.fat * scale
    };
  }

  function normalizeRecipe(recipe) {
    const base = recipe && typeof recipe === 'object' ? recipe : {};
    const servings = Math.max(1, parseInt(base.servings, 10) || 1);
    return {
      id: base.id || crypto.randomUUID(),
      name: String(base.name || '').trim(),
      image: base.image || '',
      category: String(base.category || '').trim(),
      tags: Array.isArray(base.tags)

          : [],
      servings,
      nutrition: normalizeNutrition(base.nutrition || {
        calories: base.calories,
        carbs: base.carbs,
        protein: base.protein,
        fat: base.fat
      }),
      ingredients: Array.isArray(base.ingredients) ? base.ingredients.map(item => ({

        amount: normalizeAmount(item.amount || item.amountText || item.amountValue || item.value || item)
      })).filter(item => item.name) : [],
      steps: serializeSteps(base.steps || [])
    };
  }

  function migrateRecipes(recipes) {
    return (recipes || []).map(normalizeRecipe).filter(recipe => recipe.name);
  }

  function migratePlans(plans) {
    const output = {};
    Object.entries(plans || {}).forEach(([date, dayPlan]) => {
      output[date] = {};
      mealTypes.forEach(meal => {
        const items = dayPlan?.[meal.key] || [];
        output[date][meal.key] = items.map(item => {
          if (typeof item === 'string') {
            return { recipeId: item, servings: 2 };
          }
          if (item && typeof item === 'object') {
            return {
              recipeId: item.recipeId || item.id,
              servings: Math.max(1, parseInt(item.servings, 10) || 2)
            };
          }
          return null;
        }).filter(Boolean);
      });
    });
    return output;
  }

  function normalizeLoadedState(rawState) {
    const source = rawState && typeof rawState === 'object' ? rawState : {};
    return {
      recipes: migrateRecipes(source.recipes || []),
      pantry: Array.isArray(source.pantry) ? source.pantry : [],
      plans: migratePlans(source.plans || {}),
      ingredientChecks: source.ingredientChecks && typeof source.ingredientChecks === 'object' ? source.ingredientChecks : {},
      mealShares: source.mealShares && typeof source.mealShares === 'object' ? source.mealShares : {}
    };
  }

  function loadState() {
    const snapshot = loadJson(STORAGE_KEYS.appState, null);
    if (snapshot && typeof snapshot === 'object') {
      return normalizeLoadedState(snapshot);
    }

    const legacySnapshot = loadJson(STORAGE_KEYS.legacyAppState, null);
    if (legacySnapshot && typeof legacySnapshot === 'object') {
      return normalizeLoadedState(legacySnapshot);
    }

    return normalizeLoadedState({
      recipes: loadJson(STORAGE_KEYS.recipes, loadJson(STORAGE_KEYS.legacyRecipes, DEFAULT_RECIPES)),
      pantry: loadJson(STORAGE_KEYS.pantry, loadJson(STORAGE_KEYS.legacyPantry, [])),
      plans: loadJson(STORAGE_KEYS.plans, loadJson(STORAGE_KEYS.legacyPlans, {})),
      ingredientChecks: loadJson(STORAGE_KEYS.checks, loadJson(STORAGE_KEYS.legacyChecks, {})),
      mealShares: {}

  function saveAll() {

    saveJson(STORAGE_KEYS.appState, snapshot);
    saveJson(STORAGE_KEYS.recipes, state.recipes);
    saveJson(STORAGE_KEYS.pantry, state.pantry);
    saveJson(STORAGE_KEYS.plans, state.plans);
    saveJson(STORAGE_KEYS.checks, state.ingredientChecks);

    saveJson(STORAGE_KEYS.legacyAppState, snapshot);
    saveJson(STORAGE_KEYS.legacyRecipes, state.recipes);
    saveJson(STORAGE_KEYS.legacyPantry, state.pantry);
    saveJson(STORAGE_KEYS.legacyPlans, state.plans);
    saveJson(STORAGE_KEYS.legacyChecks, state.ingredientChecks);

  function getMealShare(date, mealKey) {
    state.mealShares[date] ||= {};

    return Number.isFinite(value) && value > 0 ? value : 2;

  function setMealShare(date, mealKey, value) {

  function getRecipeTags(recipe) {  function getRecipeTags(recipe) {
    return Array.isArray(recipe.tags) ? recipe.tags : [];
  }

  function getRecipeAllText(recipe) {
    return [
      recipe.name,
      recipe.category,
      ...getRecipeTags(recipe),
      ...(recipe.ingredients || []).map(i => i.name),
      ...(recipe.seasonings || []).map(i => i.name)
    ].map(normalize).join(' ');
  }

  function recipeMatches(recipe, query, categoryFilter = '', tagFilter = '') {
    const q = normalize(query);
    if (categoryFilter && normalize(recipe.category) !== normalize(categoryFilter)) return false;
    if (tagFilter && !getRecipeTags(recipe).some(tag => normalize(tag) === normalize(tagFilter))) return false;
    if (!q) return true;
    const haystack = getRecipeAllText(recipe);
    return q.split(/\s+/).every(part => haystack.includes(part));
  }

  function getAllCategories() {
    return [...new Set(state.recipes.map(recipe => String(recipe.category || '').trim()).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'zh-CN'));
  }

  function getAllTags() {
    return [...new Set(state.recipes.flatMap(recipe => getRecipeTags(recipe)).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'zh-CN'));
  }

  function getAllPantryNames() {
    return [...new Set(
      state.recipes.flatMap(recipe => [
        ...(recipe.ingredients || []).map(item => item.name),
        ...(recipe.seasonings || []).map(item => item.name)
      ]).concat(state.pantry.map(item => item.name))
    )].filter(Boolean).sort((a, b) => a.localeCompare(b, 'zh-CN'));
  }

  function recipeCard(recipe, options = {}) {
    const previewItems = [
      ...(recipe.ingredients || []).slice(0, 2).map(i => i.name),

      <article class="recipe-card" data-recipe-id="${recipe.id}" data-action="${options.action || 'detail'}">

  function renderFilterOptions() {
    const categorySelect = $('#categoryFilter');

    if (!categorySelect || !tagSelect) return;

    tagSelect.innerHTML = `<option value="">全部标签</option>${tags.map(tag => `<option value="${escapeHtml(tag)}">${escapeHtml(tag)}</option>`).join('')}`;

    categorySelect.value = selectedCategory;
    tagSelect.value = selectedTag;

  function renderRecipes() {
    renderFilterOptions();
    const query = $('#recipeSearch').value;

  function renderPantry() {
    const names = getAllPantryNames();
    const chips = $('#pantryChips');
    chips.innerHTML = names.length ? names.map(name => {
      const selected = state.pantry.some(item => normalize(item.name) === normalize(name) && item.selected);
      return `<button class="chip selectable ${selected ? 'selected' : ''}" data-name="${escapeHtml(name)}">${escapeHtml(name)}</button>`;
    }).join('') : '<div class="empty">先添加菜谱或自定义食材。</div>';

    chips.querySelectorAll('.chip.selectable').forEach(chip => {
      chip.addEventListener('click', () => togglePantry(chip.dataset.name));
    });

    const selectedNames = state.pantry.filter(item => item.selected).map(item => normalize(item.name));
    const matches = state.recipes.filter(recipe => {
      if (!selectedNames.length) return true;
      const available = [
        ...(recipe.ingredients || []).map(i => normalize(i.name)),
        ...(recipe.seasonings || []).map(i => normalize(i.name))
      ];
      return selectedNames.every(selected => available.some(name => name.includes(selected) || selected.includes(name)));
    });

    const matchesEl = $('#pantryMatches');
    matchesEl.innerHTML = matches.length
      ? matches.map(recipe => recipeCard(recipe)).join('')

    const existing = state.pantry.find(item => normalize(item.name) === normalize(name));

    saveAll();
    renderPantry();

  function getPlanItemsForDay(date, mealKey) {
    const dayPlan = state.plans[date]?.[mealKey] || [];
    return dayPlan.map(item => {
      if (typeof item === 'string') {
        return { recipeId: item, servings: 2 };

      return {
        recipeId: item.recipeId,
        servings: Math.max(1, parseInt(item.servings, 10) || 2)

  function addRecipeToMeal(recipeId, mealType, servings = 2) {

    const items = getPlanItemsForDay(date, mealType);
    const existing = items.find(item => item.recipeId === recipeId);
    if (existing) existing.servings = servings;
    else items.push({ recipeId, servings });

  function updateMealServings(recipeId, mealType, servings) {

    const items = getPlanItemsForDay(date, mealType);
    const entry = items.find(item => item.recipeId === recipeId);
    if (!entry) return;
    entry.servings = Math.max(1, parseInt(servings, 10) || 2);
    setPlanItemsForDay(date, mealType, items);
    renderPlanner();
  }

  function removeRecipeFromMeal(recipeId, mealType) {
    const date = $('#planDate').value || getToday();
    const items = getPlanItemsForDay(date, mealType).filter(item => item.recipeId !== recipeId);
    setPlanItemsForDay(date, mealType, items);
    renderPlanner();
  }

  function combineMealItems(date) {
    const sections = { ingredients: [], seasonings: [] };
    let sequence = 0;

    mealTypes.forEach(meal => {
      const items = getPlanItemsForDay(date, meal.key);
      items.forEach(planItem => {
        const recipe = state.recipes.find(r => r.id === planItem.recipeId);
        if (!recipe) return;
        const scale = planItem.servings / Math.max(1, parseInt(recipe.servings, 10) || 2);

        ['ingredients', 'seasonings'].forEach(sectionName => {
          (recipe[sectionName] || []).forEach(entry => {
            const amount = normalizeAmount(entry.amount);
            if (amount && amount.kind === 'numeric') {
              const key = `${sectionName}|${normalize(entry.name)}|${normalize(amount.unit)}`;
              let bucket = sections[sectionName].find(item => item.kind === 'numeric' && item.key === key);
              if (!bucket) {
                bucket = {
                  section: sectionName,
                  kind: 'numeric',
                  key,
                  itemName: entry.name,
                  quantity: 0,
                  unit: amount.unit
                };
                sections[sectionName].push(bucket);
              }
              bucket.quantity += amount.quantity * scale;
            } else {
              sections[sectionName].push({
                section: sectionName,
                kind: 'text',
                key: `${sectionName}|${recipe.id}|${sequence++}`,
                itemName: entry.name,
                text: amount?.kind === 'text' ? amount.text : String(entry.amount || '').trim()
              });
            }
          });
        });
      });
    });

    sections.ingredients.sort((a, b) => {
      if (a.kind !== b.kind) return a.kind === 'numeric' ? -1 : 1;
      return a.itemName.localeCompare(b.itemName, 'zh-CN');
    });
    sections.seasonings.sort((a, b) => {
      if (a.kind !== b.kind) return a.kind === 'numeric' ? -1 : 1;
      return a.itemName.localeCompare(b.itemName, 'zh-CN');
    });

    return sections;
  }

  function calcMealNutrition(date, mealKey) {
    const totals = { calories: 0, carbs: 0, protein: 0, fat: 0 };
    let plannedPeople = 0;
    const sharePeople = getMealShare(date, mealKey);

    getPlanItemsForDay(date, mealKey).forEach(planItem => {
      const recipe = state.recipes.find(r => r.id === planItem.recipeId);
      if (!recipe) return;
      const baseServings = Math.max(1, parseInt(recipe.servings, 10) || 1);
      const scale = planItem.servings / baseServings;
      const nutrition = scaleNutrition(recipe.nutrition || {}, scale);
      ['calories', 'carbs', 'protein', 'fat'].forEach(field => {
        if (Number.isFinite(nutrition[field])) {
          totals[field] += nutrition[field];
        }
      });
      plannedPeople += planItem.servings;
    });

    const perPerson = sharePeople > 0 ? {
      calories: totals.calories / sharePeople,
      carbs: totals.carbs / sharePeople,
      protein: totals.protein / sharePeople,
      fat: totals.fat / sharePeople
    } : { calories: 0, carbs: 0, protein: 0, fat: 0 };

    return { totals, perPerson, sharePeople, plannedPeople };

  async function compressImage(file, maxWidth = 1200, quality = 0.78) {
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = dataUrl;
    });
    const scale = Math.min(1, maxWidth / img.width);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', quality);
  }

  function readIngredientRows(containerId) {
    return $$('#' + containerId + ' .ingredient-row').map(row => {
      const name = row.querySelector('.ingredient-name').value.trim();
      const amountRaw = row.querySelector('.ingredient-amount').value.trim();
      if (!name) return null;
      if (!amountRaw) {
        return { name, amount: null };
      }
      const parsed = parseAmountInput(amountRaw);
      if (parsed && parsed.kind === 'invalid-number-only') {
        throw new Error(`“${name}”只填了数字，请补上单位，例如“2个”或“300克”。`);
      }
      if (parsed && parsed.kind === 'numeric' && !String(parsed.unit || '').trim()) {
        throw new Error(`“${name}”的单位不能为空。`);
      }
      return {
        name,
        amount: parsed && parsed.kind === 'numeric'
          ? { kind: 'numeric', quantity: parsed.quantity, unit: parsed.unit }
          : parsed && parsed.kind === 'text'
            ? { kind: 'text', text: parsed.text }
            : null
      };
    }).filter(Boolean);
  }

  function renderNutritionLines(recipe, scale) {
    const nutrition = scaleNutrition(recipe.nutrition || {}, scale);
    const lines = [
      ['热量', nutrition.calories, 'kcal'],
      ['碳水', nutrition.carbs, 'g'],
      ['蛋白质', nutrition.protein, 'g'],
      ['脂肪', nutrition.fat, 'g']
    ].filter(([, value]) => Number.isFinite(value));

    if (!lines.length) {
      return '<div class="detail-summary-item">这道菜还没有填写营养信息。</div>';
    }

    return lines.map(([label, value, unit]) => `
      <div class="detail-summary-item">
        <strong>${label}</strong>：${formatNumber(value)} ${unit}
      </div>
    `).join('');
  }

  function roundToPrecision(value, precision) {
    const factor = 10 ** precision;
    return Math.round((Number(value) + Number.EPSILON) * factor) / factor;
  }

  function formatStepperValue(value, precision) {
    const rounded = roundToPrecision(value, precision);
    return precision > 0 ? String(rounded) : String(Math.round(rounded));
  }

  function bindStepper(inputEl, minusBtn, plusBtn, options = {}) {
    const step = Number(options.step ?? 1);
    const min = Number(options.min ?? 1);
    const precision = Number.isInteger(options.precision)
      ? options.precision
      : String(step).includes('.')
        ? String(step).split('.')[1].length
        : 0;
    const onChange = typeof options.onChange === 'function' ? options.onChange : null;

    const readValue = () => {
      const raw = Number(inputEl.value);
      if (!Number.isFinite(raw)) return min;
      return Math.max(min, roundToPrecision(raw, precision));
    };

    const writeValue = (value) => {
      const clamped = Math.max(min, roundToPrecision(value, precision));
      inputEl.value = formatStepperValue(clamped, precision);
      if (onChange) onChange(clamped);
    };

    minusBtn.addEventListener('click', () => writeValue(readValue() - step));
    plusBtn.addEventListener('click', () => writeValue(readValue() + step));
    inputEl.addEventListener('change', () => writeValue(readValue()));
    inputEl.addEventListener('blur', () => writeValue(readValue()));
  }

    if (btn.dataset.page === 'pantry') renderPantry();
    if (btn.dataset.page === 'planner') renderPlanner();
    if (btn.dataset.page === 'recipes') renderRecipes();
  }));

  $('#openRecipeFormBtn').addEventListener('click', () => openRecipeForm());
  $('#recipeSearch').addEventListener('input', renderRecipes);
  $('#categoryFilter').addEventListener('change', renderRecipes);
  $('#tagFilter').addEventListener('change', renderRecipes);
  $('#clearSearchBtn').addEventListener('click', () => {
    $('#recipeSearch').value = '';
    $('#categoryFilter').value = '';
    $('#tagFilter').value = '';
    renderRecipes();
  });
  $('#addPantryIngredientBtn').addEventListener('click', addCustomPantryIngredient);
  $('#customPantryInput').addEventListener('keydown', e => { if (e.key === 'Enter') addCustomPantryIngredient(); });
  $('#addIngredientRowBtn').addEventListener('click', () => addIngredientRow('ingredientRows'));
  $('#addSeasoningRowBtn').addEventListener('click', () => addIngredientRow('seasoningRows'));
  $('#addStepBtn').addEventListener('click', () => addStepRow('stepRows', ''));
  $('#recipeForm').addEventListener('submit', saveRecipe);
  $('#deleteRecipeBtn').addEventListener('click', deleteCurrentRecipe);
  $('#mealPickerSearch').addEventListener('input', renderMealPicker);
  $('#confirmMealServingBtn').addEventListener('click', confirmMealServing);

  $('#recipeImage').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    try {
      state.pendingImageData = await compressImage(file);
      $('#imagePreview').src = state.pendingImageData;
      $('#imagePreview').style.display = 'block';
    } catch {
      alert('图片读取失败，请尝试其他图片。');
    }
  });

  $$('[data-close]').forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.close)));
  $$('.modal-backdrop').forEach(backdrop => backdrop.addEventListener('click', event => {
    if (event.target === backdrop) {
      closeModal(backdrop.id);
      if (backdrop.id === 'mealServingModal') {
        state.pendingMealSelection = null;
      }
    }
  }));

  $('#planDate').value = getToday();
  $('#planDate').addEventListener('change', renderPlanner);
  $('#prevDayBtn').addEventListener('click', () => { $('#planDate').value = addDays($('#planDate').value, -1); renderPlanner(); });
  $('#nextDayBtn').addEventListener('click', () => { $('#planDate').value = addDays($('#planDate').value, 1); renderPlanner(); });
  $('#todayBtn').addEventListener('click', () => { $('#planDate').value = getToday(); renderPlanner(); });

  const loadedState = loadState();
  state.recipes = loadedState.recipes;
  state.pantry = loadedState.pantry;
  state.plans = loadedState.plans;
  state.ingredientChecks = loadedState.ingredientChecks;
  state.mealShares = loadedState.mealShares || {};

  saveAll();
  renderAll();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
})();
</script>

</body>
</html>
